function at(dd) { let i = 1; while (i < cum.length - 1 && cum[i] < dd) i++; const t = Math.max(0, Math.min(1, (dd - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1))); return [cur[i - 1][0] + (cur[i][0] - cur[i - 1][0]) * t, cur[i - 1][1] + (cur[i][1] - cur[i - 1][1]) * t]; }
